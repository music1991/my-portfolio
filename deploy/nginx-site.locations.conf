# Include these locations inside the existing HTTPS server block for this domain.
# Set the server block's root to the directory containing the contents of dist/.
# These locations serve the pre-rendered HTML files generated by vite.config.ts.

location ^~ /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = / {
    try_files /index.html =404;
}

location / {
    try_files $uri.html $uri /index.html;
}
